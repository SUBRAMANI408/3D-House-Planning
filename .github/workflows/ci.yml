name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1: Frontend build, lint, and unit tests
  # ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (build · lint · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile & Vite production build
        run: npm run build

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Backend pytest suite
  # ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q --tb=short
  # ──────────────────────────────────────────────────────────────────
  # Job 3: Playwright E2E tests (browser-enabled, with DB + Redis)
  # ──────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: house3d
          POSTGRES_PASSWORD: house3d_secret
          POSTGRES_DB: house3d
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U house3d -d house3d"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://house3d:house3d_secret@localhost:5432/house3d
          REDIS_URL: redis://localhost:6379/0
          CORS_ORIGINS: '["http://localhost:5173"]'
        run: |
          uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/backend.log 2>&1 &

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo ""
              echo "Backend is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to become ready within 30s."
          echo "--- backend log ---"
          cat /tmp/backend.log || true
          exit 1

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:8000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # Job 4: Dependency audit
  # ──────────────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies (must pass)
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Audit all dependencies (informational)
        working-directory: frontend
        # Allow failure — dev advisories are documented and monitored
        continue-on-error: true
        run: npm audit --audit-level=critical
